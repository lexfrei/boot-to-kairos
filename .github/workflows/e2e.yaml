name: e2e

# Runs as part of CI; started by hand it can install another image.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      image:
        description: Kairos image to install; empty for DEFAULT_IMAGE

permissions:
  contents: read

env:
  DEFAULT_IMAGE: quay.io/kairos/hadron:v0.5.1-core-amd64-generic-v4.3.0

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils
      - run: CGO_ENABLED=0 go build -trimpath -o boot-to-kairos ./cmd/boot-to-kairos
      - run: .github/e2e/run.sh boot-to-kairos "$IMAGE"
        env:
          IMAGE: ${{ inputs.image || env.DEFAULT_IMAGE }}
          WORK: ${{ runner.temp }}/e2e
          FIRMWARE: ${{ matrix.firmware }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-serial-log-${{ matrix.firmware }}
          path: ${{ runner.temp }}/e2e/serial.log
          if-no-files-found: ignore
